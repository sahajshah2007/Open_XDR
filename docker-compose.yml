x-backend: &backend
  build: ./backend
  environment: &backend-env
    PROJECT_NAME: TwinTrace Lab
    DATABASE_URL: postgresql+psycopg2://openxdr:${POSTGRES_PASSWORD:-change_me}@postgres:5432/openxdr
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    INGEST_API_KEY: ${INGEST_API_KEY:?Set INGEST_API_KEY in .env}
    DEBUG: "false"
    RULES_DIR: /app/rules/local
    NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    OTX_API_KEY: ${OTX_API_KEY:-}
  volumes:
    - ./rules:/app/rules:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: openxdr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: openxdr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U openxdr -d openxdr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  neo4j:
    profiles: [twin]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-set-a-neo4j-password}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
