title: Shell Download Piped Into Interpreter
id: openxdr-linux-shell-download
status: test
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
      - 'curl '
      - '|'
  interpreter:
    CommandLine|contains:
      - 'bash'
      - 'sh'
  condition: selection and interpreter
tags:
  - attack.execution
  - attack.t1059.004
level: high
